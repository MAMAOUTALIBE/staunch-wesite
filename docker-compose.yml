services:
  staunch:
    build: .
    image: staunch-website:latest
    container_name: staunch-website
    restart: always
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SITE_URL=http://srv1643859.hstgr.cloud
      - NEXT_PUBLIC_CONTACT_EMAIL=contact@staunch.gn
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      # Le réseau utilisé par les routers Traefik (à confirmer après audit VPS)
      - "traefik.docker.network=traefik"
      # Router HTTP — répond sur l'IP publique et le hostname Hostinger
      - "traefik.http.routers.staunch.rule=Host(`srv1643859.hstgr.cloud`) || Host(`187.127.228.197`)"
      - "traefik.http.routers.staunch.entrypoints=web"
      # Service Next.js exposé sur le port 3000
      - "traefik.http.services.staunch.loadbalancer.server.port=3000"
    networks:
      - traefik-network

networks:
  traefik-network:
    external: true
    # Le nom EXACT du réseau Traefik existant sur le VPS — à valider via
    # `docker network ls` après connexion SSH puis ajusté si nécessaire.
    name: traefik
