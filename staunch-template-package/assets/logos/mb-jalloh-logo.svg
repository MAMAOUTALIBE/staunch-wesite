<?xml version="1.0" encoding="UTF-8"?>
<!-- Logo MB-JALLOH - Version SVG vectorielle reconstituée -->
<!-- Couleurs officielles : #1E3A8A (bleu marine) et #38BDF8 (cyan) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Cercle extérieur bleu marine -->
  <circle cx="100" cy="100" r="95" stroke="#1E3A8A" stroke-width="6" fill="white"/>

  <!-- Arc décoratif extérieur (effet de mouvement) -->
  <path d="M 20 100 A 80 80 0 0 1 180 100" stroke="#1E3A8A" stroke-width="2" fill="none" opacity="0.4"/>
  <path d="M 25 110 A 75 75 0 0 0 175 110" stroke="#1E3A8A" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Cercle intérieur cyan léger -->
  <circle cx="100" cy="100" r="78" stroke="#38BDF8" stroke-width="3" fill="white" opacity="0.9"/>

  <!-- Lettre M stylisée (bleu marine) -->
  <path d="M 50 130 L 50 70 L 70 70 L 85 100 L 100 70 L 85 70 Z"
        fill="#1E3A8A"/>
  <path d="M 50 130 L 65 130 L 65 95 L 78 120 L 85 120 L 85 130 Z"
        fill="#1E3A8A"/>

  <!-- Lettre B stylisée (cyan) -->
  <path d="M 100 70 L 130 70 Q 150 70 150 85 Q 150 95 140 100 Q 155 105 155 117 Q 155 130 130 130 L 100 130 Z M 115 82 L 115 95 L 130 95 Q 138 95 138 88 Q 138 82 130 82 Z M 115 105 L 115 118 L 132 118 Q 142 118 142 112 Q 142 105 132 105 Z"
        fill="#38BDF8"/>

  <!-- Texte MB JALLOH -->
  <text x="100" y="170" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-weight="700"
        font-size="16"
        fill="#1E3A8A"
        letter-spacing="1">MB JALLOH</text>

  <!-- Sous-titre optionnel -->
  <text x="100" y="195" text-anchor="middle"
        font-family="Arial, sans-serif"
        font-weight="400"
        font-size="9"
        fill="#1E3A8A"
        letter-spacing="2">CABINET DE COACHING</text>
</svg>
